name: 'Release Noectra AI'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Noectra AI v__VERSION__'
          releaseBody: |
            ## 🌌 Noectra AI v__VERSION__ — The Spectrum of Intellect
            
            Welcome to the official cross-platform release of **Noectra AI**, a modern desktop research, document intelligence, and distraction-free reading platform powered by Tauri v2 and Rust.

            ### 📦 Platform Packages Available:
            - **Windows**: `.msi` installer & `.exe`
            - **macOS**: `.dmg` disk image (Apple Silicon `aarch64` & Intel `x86_64`)
            - **Linux**: `.AppImage` (standalone) & `.deb` (Debian/Ubuntu)

            ### ✨ Highlights:
            - 🌐 **In-App Live Web**: Native anti-blocking proxy bypassing `X-Frame-Options`
            - 📖 **Focus Reader Mode**: Formatted articles up to 60,000 characters
            - 🤖 **Universal AI Core**: Google Gemini, OpenRouter, and Local LLM support
            - 🔬 **Academic & News Feeds**: Real-time RSS Discover + arXiv research hub
            - 📑 **Deep Document Reader**: PDF and EPUB with TTS and RSVP speed reader
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
